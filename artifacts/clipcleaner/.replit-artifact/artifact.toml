kind = "web"
previewPath = "/"
title = "ClipCleaner"
version = "1.0.0"
id = "artifacts/clipcleaner"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25938

[services.development]
run = "pnpm --filter @workspace/clipcleaner run dev"

# Serve via a small Node static server (server.mjs) so we can send
# Cross-Origin-Opener-Policy / Cross-Origin-Embedder-Policy headers.
# Replit's static serving doesn't expose response-header configuration,
# and those headers are required for the in-browser audio extractor
# (SharedArrayBuffer / ffmpeg.wasm) to activate in production.
[services.production.build]
args = ["pnpm", "--filter", "@workspace/clipcleaner", "run", "build"]

[services.production.run]
args = ["node", "artifacts/clipcleaner/server.mjs"]

[services.production.run.env]
NODE_ENV = "production"

[services.env]
PORT = "25938"
BASE_PATH = "/"
